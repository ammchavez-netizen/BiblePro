<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3f73"/>
      <stop offset="1" stop-color="#0b1a33"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c2a1f"/>
      <stop offset="1" stop-color="#5a140e"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d2b0"/>
      <stop offset="1" stop-color="#d9a77f"/>
    </linearGradient>
    <clipPath id="clip"><rect x="8" y="8" width="240" height="240" rx="52"/></clipPath>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.5">
      <stop offset="0" stop-color="#ffe7a3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe7a3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- background -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#glow)"/>

  <!-- book: pages block (right/bottom edge) -->
  <path d="M84 40 H184 a10 10 0 0 1 10 10 V164 a8 8 0 0 1 -8 8 H84 Z" fill="#f4ecd8" stroke="#3a0d08" stroke-width="4"/>
  <path d="M188 52 V162 M182 52 V164" stroke="#cbbf9f" stroke-width="2"/>
  <!-- cover -->
  <rect x="62" y="34" width="118" height="134" rx="10" fill="url(#cover)" stroke="#3a0d08" stroke-width="4"/>
  <!-- spine shading -->
  <rect x="62" y="34" width="16" height="134" rx="8" fill="#000" opacity="0.18"/>
  <!-- gold border -->
  <rect x="84" y="46" width="84" height="110" rx="5" fill="none" stroke="#e9c15a" stroke-width="3" opacity="0.85"/>
  <!-- cross -->
  <rect x="119" y="62" width="12" height="74" rx="3" fill="#f2cd62"/>
  <rect x="100" y="82" width="50" height="12" rx="3" fill="#f2cd62"/>

  <!-- hand: palm under the book, thumb over the front-left -->
  <path d="M30 238
           C34 210 44 190 60 176
           C72 166 92 160 116 160
           L196 160
           C210 160 216 170 210 178
           C204 186 192 186 180 186
           L150 186
           C160 192 162 204 150 208
           C136 214 112 214 92 212
           C76 222 70 232 66 240 Z"
        fill="url(#skin)" stroke="#7a4a2c" stroke-width="4" stroke-linejoin="round"/>
  <!-- finger creases -->
  <path d="M150 186 C140 186 128 188 118 192" fill="none" stroke="#7a4a2c" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M196 170 C184 172 170 172 158 170" fill="none" stroke="#7a4a2c" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- thumb wrapping onto the cover -->
  <path d="M66 176 C62 160 64 140 74 130 C82 122 92 128 90 140 C88 150 86 162 88 172 Z"
        fill="url(#skin)" stroke="#7a4a2c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M76 134 C80 130 86 131 86 137" fill="none" stroke="#c98f6a" stroke-width="3" stroke-linecap="round"/>
</svg>
