<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3CA8FA"/>
      <stop offset="0.35" stop-color="#1A8BEA"/>
      <stop offset="0.7" stop-color="#0A5FC0"/>
      <stop offset="1" stop-color="#05307F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#2E8DF0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2E8DF0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FD6FF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#5AA9F0" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#6E9EEB" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3E9F2"/>
    </linearGradient>
    <linearGradient id="pageSpine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.75" stop-color="#7F9CC4" stop-opacity="0"/>
      <stop offset="1" stop-color="#7F9CC4" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#D3DCEA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#021A4A" flood-opacity="0.55"/>
    </filter>
    <clipPath id="sq"><rect x="56" y="56" width="912" height="912" rx="150"/></clipPath>

    <!-- one half of the book (left); right half is mirrored -->
    <g id="half">
      <path d="M211,500 Q211,486 225,486 L340,486 L500,600 L500,814 Q362,782 211,798 Z" fill="url(#cover)"/>
      <path d="M276,446 Q276,432 290,431 Q410,418 500,470 L500,762 Q400,722 276,728 Z"
            fill="url(#page)" stroke="#0E54AE" stroke-width="10" stroke-linejoin="round"/>
      <path d="M276,446 Q276,432 290,431 Q410,418 500,470 L500,762 Q400,722 276,728 Z" fill="url(#pageSpine)"/>
    </g>
  </defs>

  <g clip-path="url(#sq)">
    <rect x="56" y="56" width="912" height="912" fill="url(#bg)"/>
    <rect x="56" y="56" width="912" height="912" fill="url(#glow)"/>
    <path d="M56,56 H968 V420 Q512,470 56,420 Z" fill="url(#gloss)"/>
  </g>
  <rect x="61" y="61" width="902" height="902" rx="145" fill="none" stroke="url(#rim)" stroke-width="10"/>

  <g filter="url(#shadow)">
    <use href="#half" transform="translate(4,0)"/>
    <use href="#half" transform="translate(1020,0) scale(-1,1)"/>
  </g>
</svg>
